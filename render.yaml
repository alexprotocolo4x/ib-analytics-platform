services:
  - type: web
    name: ib-analytics-platform
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python3 main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
